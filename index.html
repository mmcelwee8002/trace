<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Trace</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-shell">
    <header class="game-header">

      <details class="settings">
        <summary>⚙</summary>

        <div class="settings-panel">
          <label for="handedness-select">Handedness</label>
          <select id="handedness-select">
            <option value="right">Right-handed</option>
            <option value="left">Left-handed</option>
          </select>

          <label for="theme-select">Color theme</label>
          <select id="theme-select">
            <option value="default">Default</option>
            <option value="high-contrast">High Contrast</option>
            <option value="color-vision-friendly">Color-Vision-Friendly</option>
          </select>
        </div>
      </details>

      <h1 class="logo">Trace</h1>
      <p class="level-number">Level 1</p>
      <p class="level-title"></p>
    </header>



    <section class="game-board" aria-label="Trace puzzle board">
      <!-- The puzzle grid will be generated here with JavaScript. -->
    </section>

    <p class="game-message">
      Start at the circle and reach the star.
    </p>

    <p class="level-message" aria-live="polite"></p>

    <div class="game-controls">
      <button class="previous-button">Previous Level</button>
      <button id="undo-button" type="button">Undo</button>
      <button class="restart-button">Restart</button>
      <button class="next-button">Next Level</button>

    </div>

    <!-- Temporary development-only Maze V2 launcher. -->
    <div class="game-controls maze-v2-development-controls">
      <button id="maze-v2-preview-button" type="button">
        Maze V2 Preview
      </button>
    </div>
  </main>



  <footer>
    <p>© 2026 Trace All rights reserved | Feedback: <a href="mailto:9921ops@gmail.com"> 9921ops@gmail.com </a></p>


  </footer>


  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="renderer.js"></script>
  <script src="input.js"></script>
  <script src="script.js"></script>
  <script src="automation.js"></script>
  <script src="maze-generator.js"></script>
  <script src="generated-board.js"></script>
  <script src="maze-v2.js"></script>
  <script src="testing.js"></script>

</body>



</html>
