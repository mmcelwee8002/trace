<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Trace</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-shell">
    <header class="game-header">

      <details class="settings">
        <summary aria-label="Settings" title="Settings">⚙</summary>

        <div class="settings-panel">
          <label for="handedness-select">Handedness</label>
          <select id="handedness-select">
            <option value="right">Right-handed</option>
            <option value="left">Left-handed</option>
          </select>

          <label for="theme-select">Color theme</label>
          <select id="theme-select">
            <option value="default">Default</option>
            <option value="high-contrast">High Contrast</option>
            <option value="color-vision-friendly">Color-Vision-Friendly</option>
          </select>
        </div>
      </details>

      <h1 class="logo">Trace</h1>
    </header>

    <section id="landing-view" aria-labelledby="difficulty-heading">
      <h2 id="difficulty-heading">Choose a difficulty</h2>
      <div class="difficulty-choices">
        <button type="button" data-difficulty="easy"><span>Easy</span><span class="prototype-progress">0 / 10</span></button>
        <button type="button" data-difficulty="medium"><span>Medium</span><span class="prototype-progress">0 / 10</span></button>
        <button type="button" data-difficulty="hard"><span>Hard</span><span class="prototype-progress">0 / 10</span></button>
        <button type="button" data-difficulty="extreme"><span>Extreme</span><span class="prototype-progress">0 / 10</span></button>
      </div>
      <p id="landing-message" role="status"></p>
    </section>

    <section id="puzzle-view" aria-labelledby="puzzle-heading" hidden>
      <h2 id="puzzle-heading" tabindex="-1"></h2>
      <!-- Retained for legacy campaign and development helpers. -->
      <p class="level-number" hidden></p>
      <p class="level-title" hidden></p>

    <section class="game-board" aria-label="Trace puzzle board">
      <!-- The puzzle grid will be generated here with JavaScript. -->
    </section>

    <p class="game-message">
      Start at the circle and reach the star.
    </p>

    <p class="level-message" aria-live="polite"></p>

    <div class="game-controls">
      <button id="home-button" type="button">Home</button>
      <button id="catalog-previous-button" type="button" disabled>Previous</button>
      <button class="previous-button" hidden>Previous Level</button>
      <button id="undo-button" type="button" hidden>Undo</button>
      <button class="restart-button">Restart</button>
      <button id="catalog-next-button" type="button" disabled>Next</button>
      <button class="next-button" hidden>Next Level</button>

    </div>
    </section>

    <!-- Temporary development-only Maze V2 launcher. -->
    <div class="game-controls maze-v2-development-controls" hidden>
      <button id="maze-v2-preview-button" type="button">
        Maze V2 Preview
      </button>
      <p id="maze-v2-preview-status" aria-live="polite"></p>
    </div>
  </main>



  <footer>
    <p>© 2026 Trace All rights reserved | Feedback: <a href="mailto:9921ops@gmail.com"> 9921ops@gmail.com </a></p>


  </footer>


  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="renderer.js"></script>
  <script src="input.js"></script>
  <script src="script.js"></script>
  <script src="automation.js"></script>
  <script src="maze-generator.js"></script>
  <script src="generated-board.js"></script>
  <script src="maze-v2.js"></script>
  <script src="maze-v2-catalog.js"></script>
  <script src="navigation.js"></script>
  <script src="testing.js"></script>

</body>



</html>
